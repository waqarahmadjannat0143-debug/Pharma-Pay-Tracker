name: Build MedPay Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "artifacts/mobile/**"
      - "lib/api-client-react/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

concurrency:
  group: medpay-android-apk
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_DOMAIN: pharma-pay-tracker.onrender.com
      CI: "1"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Android project
        working-directory: artifacts/mobile
        run: pnpm exec expo prebuild --platform android --clean --no-install

      - name: Build standalone release APK
        working-directory: artifacts/mobile/android
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature and checksum
        run: |
          APK="artifacts/mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          apksigner verify --verbose "$APK"
          sha256sum "$APK" | tee MedPay-Release-APK.sha256

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: MedPay-Release-APK
          path: |
            artifacts/mobile/android/app/build/outputs/apk/release/app-release.apk
            MedPay-Release-APK.sha256
          if-no-files-found: error
          retention-days: 14
