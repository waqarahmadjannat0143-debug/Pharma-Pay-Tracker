name: Keep MedPay API Awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-medpay-api-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping API health endpoint
        run: curl --fail --silent --show-error --max-time 60 --retry 2 --retry-delay 5 https://pharma-pay-tracker.onrender.com/api/healthz
